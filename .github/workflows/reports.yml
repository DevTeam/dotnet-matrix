name: Run .NET Matrix Reports

on:
  workflow_dispatch:
    inputs:
      libraries:
        description: "Library filter (comma-separated, empty = all)"
        required: false
        default: ""
      benchmarks:
        description: "Run benchmarks after feature validation"
        type: boolean
        default: true
      smoke:
        description: "Smoke run: one iteration, numbers are not trustworthy"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: matrix-reports
  cancel-in-progress: false

jobs:
  discover:
    name: Discover categories
    runs-on: ubuntu-latest
    outputs:
      categories: ${{ steps.matrix.outputs.categories }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build category matrix
        id: matrix
        run: |
          dotnet run --project ./build -- ci-matrix --output artifacts/ci-matrix.json
          echo "categories=$(jq -c . artifacts/ci-matrix.json)" >> "$GITHUB_OUTPUT"

  reports:
    name: Reports (${{ matrix.category }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        category: ${{ fromJSON(needs.discover.outputs.categories) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run .NET Matrix reports
        env:
          CATEGORY: ${{ matrix.category }}
          LIBRARIES: ${{ inputs.libraries }}
          RUN_BENCHMARKS: ${{ inputs.benchmarks }}
          SMOKE: ${{ inputs.smoke }}
        run: |
          args=(ci-reports --category "$CATEGORY")
          if [[ -n "$LIBRARIES" ]]; then
            args+=(--libraries "$LIBRARIES")
          fi
          if [[ "$SMOKE" == "true" ]]; then
            args+=(--smoke)
          fi
          if [[ "$RUN_BENCHMARKS" != "true" ]]; then
            args+=(--skip-benchmarks)
          fi
          dotnet run --project ./build -- "${args[@]}"

      - name: Publish summary
        if: always()
        run: cat "artifacts/ci-reports/summaries/${{ matrix.category }}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix-reports-${{ matrix.category }}
          path: artifacts/ci-reports
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge reports
    needs: reports
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download category reports
        uses: actions/download-artifact@v7
        with:
          pattern: matrix-reports-*
          path: artifacts/merged
          merge-multiple: true

      - name: Publish combined summary
        run: |
          find artifacts/merged/summaries -type f -name '*.md' -print0 \
            | sort -z \
            | xargs -0 cat >> "$GITHUB_STEP_SUMMARY"

      - name: Merge report artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: matrix-reports
          pattern: matrix-reports-*
          delete-merged: true
          retention-days: 30
